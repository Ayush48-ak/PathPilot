services:
  postgres:
    image: postgres:17-alpine
    container_name: pathpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pathpilot
      POSTGRES_PASSWORD: pathpilot_dev
      POSTGRES_DB: pathpilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pathpilot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: